<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Join a Club — Class Mate</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: "Poppins", sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      padding-top: 60px;
      margin: 0;
    }

    video#bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .35);
      backdrop-filter: blur(8px);
      z-index: -2;
    }

    .page-wrap {
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      padding: 30px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.03));
      box-shadow: 0 8px 40px rgba(0, 0, 0, .45);
      backdrop-filter: blur(18px);
    }

    .header-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .header-top h1 {
      color: #00e0ff;
      font-size: 1.9rem;
      letter-spacing: .2px;
    }

    .logo-wrap {
      width: 120px;
      height: 120px;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid rgba(0, 191, 165, 0.12);
      overflow: hidden;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    form#clubForm {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(3, 1fr);
      align-items: start;
    }

    .span-3 {
      grid-column: 1 / -1;
    }

    .span-2 {
      grid-column: 1 / span 2;
    }

    label {
      display: block;
      font-size: .9rem;
      margin-bottom: 6px;
      color: rgba(224, 242, 241, 0.95);
      font-weight: 600;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      font-size: 0.95rem;
    }

    input::placeholder {
      color: #666
    }

    .fee-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      color: #e0f7f6;
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
    }

    .btn {
      background: linear-gradient(135deg, #00e0ff, #00b3ff);
      border: none;
      padding: 12px 22px;
      border-radius: 28px;
      font-weight: 700;
      cursor: pointer;
      color: #000;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 179, 255, .12)
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .input-error {
      outline: 2px solid rgba(255, 80, 80, .9);
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #00e0ff;
      color: #000;
      padding: 10px 16px;
      border-radius: 10px;
      display: none;
      box-shadow: 0 6px 26px rgba(0, 0, 0, .4);
      font-weight: 600;
    }

    .toast.error {
      background: #ff5050;
      color: #fff;
    }

    @media(max-width:1100px) {
      form#clubForm {
        grid-template-columns: repeat(2, 1fr);
      }

      .span-2 {
        grid-column: 1/-1;
      }

      .header-top h1 {
        font-size: 1.6rem
      }
    }

    @media(max-width:700px) {
      .page-wrap {
        padding: 18px;
        margin: 18px auto
      }

      form#clubForm {
        grid-template-columns: 1fr
      }

      .logo-wrap {
        width: 96px;
        height: 96px;
        border-radius: 48px
      }

      .header-top h1 {
        font-size: 1.4rem
      }

      .actions {
        justify-content: center
      }
    }

    footer {
      width: 100%;
      max-height: 180px;
      text-align: center;
      background-color: #3f4041;
      color: white;
      padding: 20px;
      margin-top: auto;
    }

    footer p {
      text-align: center;
      color: white;
      font-weight: 500;
      margin: 10px 0;
    }

    .footer-bottom-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    footer .social-links {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }

    footer .social-links a {
      color: white;
      font-size: 1.2em;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.1);
      text-decoration: none;
    }

    footer .social-links a:hover {
      color: orangered;
      background-color: rgba(255, 69, 0, 0.2);
      transform: translateY(-3px);
    }

    .navbar {
      background-color: #ffffff;
      color: #000;
      padding: 10px 20px;
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1200px;
      margin: 5px auto;
    }

    .navbar-logo h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }

    .navbar-menu {
      display: flex;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .navbar-menu li {
      margin-left: 20px;
    }

    .navbar-menu a {
      color: #000;
      text-decoration: none;
      font-size: 16px;
      transition: color 0.3s;
    }

    .navbar-menu a:hover {
      color: orangered;
    }

    .navbar-toggle {
      display: none;
      flex-direction: column;
      cursor: pointer;
    }

    .navbar-toggle .bar {
      width: 25px;
      height: 3px;
      background-color: #000;
      margin: 3px 0;
      transition: 0.3s;
    }

    @media(max-width:768px) {
      .navbar-menu {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 100%;
        right: 0;
        width: 30%;
        background-color: #ffffff;
        padding: 5px 0;
      }

      .navbar-menu.active {
        display: flex;
      }

      .navbar-menu li {
        margin: 12px;
        text-align: right;
      }

      .navbar-toggle {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-logo">
        <h2>CGPA <span style="color: orangered;">Calculator</span></h2>
      </div>
      <ul class="navbar-menu" id="navbarMenu">
        <li><a href="index.html">Home</a></li>
        <li><a href="compiler.html">Online Compiler</a></li>
        <li><a href="PreviousQ.html">Question Bank</a></li>
      </ul>
      <div class="navbar-toggle" id="navbarToggle">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </div>
    </div>
  </nav>

  <!-- Background video -->
  <video id="bgVideo" autoplay muted loop playsinline preload="auto">
    <source src="images/homeVideo.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <main class="page-wrap" role="main" style="margin-top: 2rem;">
    <div class="header-top">
      <div class="logo-wrap" aria-hidden="true">
        <img id="topLogo" src="images/default.png" alt="Club logo">
      </div>
      <h1>Join Leading University Clubs</h1>
    </div>

    <form id="clubForm" novalidate>
      <!-- Club select -->
      <div class="span-3">
        <label for="clubSelect">Select Club <small style="color:#9be7e6">* required</small></label>
        <select id="clubSelect" required>
          <option value="">-- choose club --</option>
          <option value="LUSC">LUSC - Sports Club</option>
          <option value="LUPS">LUPS - Photography Society</option>
          <option value="LUMUNA">LUMUNA - MUN Association</option>
          <option value="LUDC">LUDC - Debating Club</option>
          <option value="LUCC">LUCC - Cultural Club</option>
          <option value="LUIEEE">LUIEEE - Electrical & Electronics Club</option>
          <option value="LULC">LULC - Language Club</option>
          <option value="LURS">LURS - Research Society</option>
          <option value="LUBC">LUBC - Business Club</option>
          <option value="LUSS">LUSS - Social Service Club</option>
        </select>
      </div>

      <!-- Fee box -->
      <div class="fee-box span-3" id="feeBox">Membership fee: —</div>

      <!-- Left column -->
      <div class="form-group">
        <label for="department">Department <small style="color:#9be7e6">* </small></label>
        <select id="department" required>
          <option value="">Select Department</option>
          <option>Department of Business Administration</option>
          <option>Department of CSE</option>
          <option>Department of English</option>
          <option>Department of Architecture</option>
          <option>Department of Law</option>
          <option>Department of Civil Engineering</option>
          <option>Department of EEE</option>
          <option>Department of Islamic Studies</option>
          <option>Department of Public Health</option>
          <option>Department of Tourism and Hospitality Management</option>
        </select>
      </div>

      <div class="form-group">
        <label for="batch">Batch <small style="color:#9be7e6">* </small></label>
        <select id="batch" required>
          <option value="">Select Batch</option>
          <option>58</option>
          <option>59</option>
          <option>60</option>
          <option>61</option>
          <option>62</option>
          <option>63</option>
          <option>64</option>
          <option>65</option>
          <option>66</option>
        </select>
      </div>

      <div class="form-group">
        <label for="section">Section <small style="color:#9be7e6">* </small></label>
        <select id="section" required>
          <option value="">Select Section</option>
          <option>A</option>
          <option>B</option>
          <option>C</option>
          <option>D</option>
          <option>E</option>
          <option>F</option>
          <option>G</option>
        </select>
      </div>

      <!-- Middle / other columns -->
      <div class="form-group">
        <label for="fullname">Full Name <small style="color:#9be7e6">* </small></label>
        <input id="fullname" type="text" placeholder="Your full name" required />
      </div>

      <div class="form-group">
        <label for="studentId">Student ID <small style="color:#9be7e6">* </small></label>
        <input id="studentId" type="text" placeholder="e.g., 21303058" required />
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <small style="color:#9be7e6">* </small></label>
        <input id="phone" type="tel" placeholder="017XXXXXXXX" pattern="01[0-9]{9}" required />
      </div>

      <div class="form-group">
        <label for="email">Email <small style="color:#9be7e6">* </small></label>
        <input id="email" type="email" placeholder="example@gmail.com" required />
      </div>

      <div class="form-group">
        <label for="BkashNumber">Bkash Number</label>
        <div class="fee-box" id="bkashDisplay">—</div>
      </div>

      <div class="form-group">
        <label for="Bkash">Bkash Transaction ID</label>
        <input id="Bkash" type="text" placeholder="10-digit Transaction ID" maxlength="10" />
      </div>

      <!-- Actions: Submit -->
      <div class="actions span-3" style="justify-content:space-between; align-items:center;">
        <div style="color:#bffaff; font-weight:600">Selected Club Logo shown above</div>
        <div>
          <button class="btn" type="submit" id="submitBtn">Submit</button>
        </div>
      </div>
    </form>
  </main>

  <footer>
    <div class="footer-bottom">
      <div class="footer-bottom-content">
        <div class="copyright">
          <p>&copy; 2025 Class Mate by SRM Technologies. All rights reserved.</p>
        </div>
        <div class="social-links">
          <span>Follow us:</span>
          <a href="https://www.facebook.com" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="https://www.twitter.com" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
          <a href="https://www.instagram.com" target="_blank" aria-label="Instagram"><i
              class="fab fa-instagram"></i></a>
          <a href="https://www.linkedin.com" target="_blank" aria-label="LinkedIn"><i
              class="fab fa-linkedin-in"></i></a>
        </div>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast">Form submitted ✓</div>

  <script>
    // Initialize EmailJS
    (function () {
      emailjs.init("hpIFnib75FuQb89lS");
    })();

    /* club -> file mapping */
    const clubLogoMap = {
      LUSC: "images/sports_club_logo.jpeg",
      LUPS: "images/photography_club_logo.jpeg",
      LUMUNA: "images/MUN_club_logo.jpeg",
      LUDC: "images/Debating_club_logo.jpeg",
      LUCC: "images/LUCC.jpg",
      LUIEEE: "images/IEEE_club_logo.jpeg",
      LULC: "images/language_Club.jpeg",
      LURS: "images/research_club_logo.jpeg",
      LUBC: "images/business_club_logo.png",
      LUSS: "images/social_service_club_logo.jpeg"
    };

    const clubFeeMap = {
      LUSC: "50 TK",
      LUPS: "80 TK",
      LUMUNA: "100 TK",
      LUDC: "70 TK",
      LUCC: "60 TK",
      LUIEEE: "60 TK",
      LULC: "70 TK",
      LURS: "100 TK",
      LUBC: "100 TK",
      LUSS: "50 TK"
    };

    const clubBkash = {
      LUSC: "01727419001",
      LUPS: "01827419001",
      LUMUNA: "01927419001",
      LUDC: "016401711394",
      LUCC: "01401711394",
      LUIEEE: "017401711394",
      LULC: "01763777626",
      LURS: "01963777626",
      LUBC: "01663777626",
      LUSS: "01563777626",
    };

    // DOM elements
    const topLogo = document.getElementById("topLogo");
    const clubSelect = document.getElementById("clubSelect");
    const feeBox = document.getElementById("feeBox");
    const form = document.getElementById("clubForm");
    const toast = document.getElementById("toast");
    const submitBtn = document.getElementById("submitBtn");
    const bkashDisplay = document.getElementById("bkashDisplay");

    // Default fallback SVG logo
    const defaultLogoSVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%2300e0ff;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%2300b3ff;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='100' cy='100' r='90' fill='url(%23grad)' opacity='0.9'/%3E%3Ctext x='100' y='115' text-anchor='middle' font-size='48' fill='%23fff' font-family='Arial, sans-serif' font-weight='bold'%3ELU%3C/text%3E%3Ctext x='100' y='145' text-anchor='middle' font-size='16' fill='%23fff' font-family='Arial, sans-serif'%3EClubs%3C/text%3E%3C/svg%3E";

    // Handle logo load errors
    topLogo.addEventListener("error", function () {
      this.src = defaultLogoSVG;
    });

    // Update fee, logo, and Bkash number when club changes
    clubSelect.addEventListener("change", () => {
      const val = clubSelect.value;

      // Logo
      if (val && clubLogoMap[val]) {
        topLogo.src = clubLogoMap[val];
      } else {
        topLogo.src = "images/default.png";
        topLogo.onerror = function () { this.src = defaultLogoSVG; };
      }

      // Fee
      feeBox.textContent = "Membership fee: " + (clubFeeMap[val] || "—");

      // Bkash Number
      bkashDisplay.textContent = clubBkash[val] || "—";
    });

    // Simple validation helper
    function markError(el) {
      el.classList.add("input-error");
      setTimeout(() => el.classList.remove("input-error"), 2200);
    }

    // Show toast
    function showToast(message, isError = false) {
      toast.textContent = message;
      toast.classList.toggle('error', isError);
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 3000);
    }

    // Form submission
    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const requiredIds = ["clubSelect", "department", "batch", "section", "fullname", "studentId", "phone", "email"];
      let ok = true;

      for (const id of requiredIds) {
        const el = document.getElementById(id);
        if (!el) continue;
        const value = (el.value || "").trim();
        if (!value) {
          ok = false;
          markError(el);
          alert("Please fill: " + (el.previousElementSibling ? el.previousElementSibling.innerText : id));
          el.focus();
          break;
        }
        if (id === "phone" && !/^01[0-9]{9}$/.test(value)) {
          ok = false;
          markError(el);
          alert("Please enter a valid phone number (11 digits starting with 01).");
          el.focus();
          break;
        }
        if (id === "studentId" && !/^\d+$/.test(value)) {
          ok = false;
          markError(el);
          alert("Student ID should contain only digits.");
          el.focus();
          break;
        }
        if (id === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          ok = false;
          markError(el);
          alert("Please enter a valid email address.");
          el.focus();
          break;
        }
      }

      // Transaction ID check
      const trxIdEl = document.getElementById("Bkash");
      if (trxIdEl && trxIdEl.value.trim() && !/^[0-9A-Z]{10}$/.test(trxIdEl.value.trim())) {
        ok = false;
        markError(trxIdEl);
        alert("Bkash Transaction ID should be 10 characters (digits and letters).");
        trxIdEl.focus();
      }

      if (!ok) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      // Prepare data
      const data = {
        club: clubSelect.value,
        fee: clubFeeMap[clubSelect.value] || null,
        bkashNumber: bkashDisplay.textContent,
        department: document.getElementById("department").value,
        batch: document.getElementById("batch").value,
        section: document.getElementById("section").value,
        fullname: document.getElementById("fullname").value.trim(),
        studentId: document.getElementById("studentId").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        trxId: trxIdEl ? trxIdEl.value.trim() : ''
      };

      const templateParams = {
        student_name: data.fullname,
        student_id: data.studentId,
        club_name: data.club,
        department: data.department,
        batch: data.batch,
        section: data.section,
        email: data.email,
        phone: data.phone,
        fee: data.fee,
        bkash_number: data.bkashNumber,
        bkash_trx: data.trxId || 'Not Provided'
      };

      // Send email
      emailjs.send('service_s74zlvr', 'template_n0wksf3', templateParams)
        .then(function (response) {
          showToast('Form submitted successfully! ✓');
          form.reset();
          topLogo.src = "images/default.png";
          topLogo.onerror = function () { this.src = defaultLogoSVG; };
          feeBox.textContent = "Membership fee: —";
          bkashDisplay.textContent = "—";
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
        }, function (error) {
          console.error(error);
          alert('Failed to send email. Check console for details.');
          showToast('Failed to send email. Please try again.', true);
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit";
        });
    });

    // Navbar toggle
    const navbarToggle = document.getElementById("navbarToggle");
    const navbarMenu = document.getElementById("navbarMenu");

    navbarToggle.addEventListener("click", () => {
      navbarMenu.classList.toggle("active");
    });

    document.addEventListener("click", (e) => {
      if (!navbarToggle.contains(e.target) && !navbarMenu.contains(e.target)) {
        navbarMenu.classList.remove("active");
      }
    });

  </script>
</body>

</html>
