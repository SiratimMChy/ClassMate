<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant — ClassMate</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/aiChatbot.css">
</head>
<body>

  <!-- Navbar -->
  <header id="mainHeader">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon"><i class="fas fa-robot"></i></div>
        <span>Class<em>Mate</em></span>
      </a>
      <nav class="nav-links">
        <a href="index.html"     class="nav-link"><i class="fas fa-house"></i> Home</a>
        <a href="aiChatbot.html" class="nav-link"><i class="fas fa-robot"></i> AI ChatBot</a>
        <a href="compiler.html"  class="nav-link"><i class="fas fa-code"></i> Compiler</a>
        <a href="PreviousQ.html" class="nav-link"><i class="fas fa-book-open"></i> Question Bank</a>
        <a href="CgpACal.html"   class="nav-link"><i class="fas fa-calculator"></i> CGPA</a>
      </nav>
      <button class="nav-hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-drawer" id="navDrawer">
      <a href="index.html"     class="drawer-link"><i class="fas fa-house"></i> Home</a>
      <a href="aiChatbot.html" class="drawer-link"><i class="fas fa-robot"></i> AI ChatBot</a>
      <a href="compiler.html"  class="drawer-link"><i class="fas fa-code"></i> Online Compiler</a>
      <a href="PreviousQ.html" class="drawer-link"><i class="fas fa-book-open"></i> Question Bank</a>
      <a href="CgpACal.html"   class="drawer-link"><i class="fas fa-calculator"></i> CGPA Calculator</a>
    </div>
  </header>

  <!-- Welcome screen -->
  <div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-inner">
      <div class="welcome-icon">
        <i class="fas fa-robot"></i>
      </div>
      <h1 class="welcome-title">Hi, I'm <span>StudyMate AI</span></h1>
      <p class="welcome-sub">Your academic assistant powered by Llama 3. Ask me anything about your studies.</p>
      <div class="quick-chips">
        <button class="chip" data-msg="Explain the concept of recursion in programming">💡 Explain recursion</button>
        <button class="chip" data-msg="How do I calculate CGPA from my grades?">📊 Calculate CGPA</button>
        <button class="chip" data-msg="Give me tips for exam preparation">📚 Exam tips</button>
        <button class="chip" data-msg="What is object-oriented programming?">🖥️ What is OOP?</button>
      </div>
    </div>
  </div>

  <!-- Chat messages -->
  <div class="chat-list" id="chatList"></div>

  <!-- Input area -->
  <div class="typing-area">
    <form class="typing-form" id="typingForm">
      <div class="input-wrap">
        <div class="attach-preview" id="attach-preview"></div>
        <div class="input-bar">
          <button id="attach-file-button" type="button" class="bar-btn" title="Attach file">
            <i class="fas fa-paperclip"></i>
          </button>
          <input type="text" placeholder="Ask me anything…" class="typing-input" />
          <input id="file-input" type="file" accept="image/*,.pdf" multiple style="display:none" />
          <button id="send-message-button" type="submit" class="send-btn" title="Send">
            <i class="fas fa-paper-plane"></i>
          </button>
          <button id="delete-chat-button" type="button" class="bar-btn danger" title="Clear chat">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
        <p class="disclaimer">AI can make mistakes. Double-check important information.</p>
      </div>
    </form>
  </div>

  <script src="js/aiChatbot.js"></script>
  <script>
    // Navbar
    const hamburger = document.getElementById('hamburger');
    const navDrawer = document.getElementById('navDrawer');
    const mainHeader = document.getElementById('mainHeader');

    window.addEventListener('scroll', () => mainHeader.classList.toggle('scrolled', window.scrollY > 10));
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      navDrawer.classList.toggle('open');
    });
    navDrawer.querySelectorAll('.drawer-link').forEach(l => l.addEventListener('click', () => {
      hamburger.classList.remove('open');
      navDrawer.classList.remove('open');
    }));
    document.querySelectorAll('.nav-link').forEach(l => {
      const linkFile = l.getAttribute('href').split('/').pop().split('?')[0];
      const currentFile = location.pathname.split('/').pop() || 'index.html';
      if (linkFile === currentFile) l.classList.add('active');
    });

    // Quick chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const input = document.querySelector('.typing-input');
        input.value = chip.dataset.msg;
        document.getElementById('send-message-button').click();
      });
    });
  </script>
</body>
</html>
