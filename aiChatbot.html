<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant — ClassMate</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/aiChatbot.css">
  <script src="js/components/navbar.js"></script>
</head>
<body>

  <!-- Navbar -->
  <classmate-navbar home-link="index.html"></classmate-navbar>

  <!-- Welcome screen -->
  <div class="welcome-screen" id="welcomeScreen">
    <div class="welcome-inner">
      <div class="welcome-icon">
        <i class="fas fa-robot"></i>
      </div>
      <h1 class="welcome-title">Hi, I'm <span>StudyMate AI</span></h1>
      <p class="welcome-sub">Your academic assistant powered by Llama 3. Ask me anything about your studies.</p>
      <div class="quick-chips">
        <button class="chip" data-msg="Explain the concept of recursion in programming">💡 Explain recursion</button>
        <button class="chip" data-msg="How do I calculate CGPA from my grades?">📊 Calculate CGPA</button>
        <button class="chip" data-msg="Give me tips for exam preparation">📚 Exam tips</button>
        <button class="chip" data-msg="What is object-oriented programming?">🖥️ What is OOP?</button>
      </div>
    </div>
  </div>

  <!-- Chat messages -->
  <div class="chat-list" id="chatList"></div>

  <!-- Input area -->
  <div class="typing-area">
    <form class="typing-form" id="typingForm">
      <div class="input-wrap">
        <div class="attach-preview" id="attach-preview"></div>
        <div class="input-bar">
          <button id="attach-file-button" type="button" class="bar-btn" title="Attach file">
            <i class="fas fa-paperclip"></i>
          </button>
          <input type="text" placeholder="Ask me anything…" class="typing-input" />
          <input id="file-input" type="file" accept="image/*,.pdf" multiple style="display:none" />
          <button id="send-message-button" type="submit" class="send-btn" title="Send">
            <i class="fas fa-paper-plane"></i>
          </button>
          <button id="delete-chat-button" type="button" class="bar-btn danger" title="Clear chat">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
        <p class="disclaimer">AI can make mistakes. Double-check important information.</p>
      </div>
    </form>
  </div>

  <script src="js/aiChatbot.js"></script>
  <script>
    // Quick chips
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const input = document.querySelector('.typing-input');
        input.value = chip.dataset.msg;
        document.getElementById('send-message-button').click();
      });
    });
  </script>
</body>
</html>
